name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run shell and safety checks
        run: sh tests/run-all.sh

      - name: Scan full Git history for sensitive values
        run: sh tests/scan-history-sensitive.sh
