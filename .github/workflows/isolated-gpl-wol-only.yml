name: Isolated GPL WOL-only Source Gate
on:
  push:
    branches: [test/gpl-qr-poll-isolated-20261113]
    paths:
      - labs/gpl-isolation/**
      - .github/workflows/isolated-gpl-wol-only.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpl-wol-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      UU_NO_GTK: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain for separate GPL source, not the MIT product
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libx11-dev libxext-dev libxtst-dev libxfixes-dev iproute2
          rustup update stable --no-self-update
      - name: Retrieve exact upstream GPL-3.0-or-later release
        run: |
          git clone --depth 1 --branch v0.2.58 https://github.com/VallierDev/uu-remote-linux.git "$RUNNER_TEMP/gpl-source"
          cd "$RUNNER_TEMP/gpl-source"
          test "$(git rev-parse HEAD)" = "0e1e935fb41c2aac2bdd5eebdd4b38a7476d14bc"
          grep -q 'GPL-3.0-or-later' Cargo.toml
      - name: Apply test-only allowlisted WOL source gates
        run: |
          python3 labs/gpl-isolation/apply-wol-only.py "$RUNNER_TEMP/gpl-source"
          cd "$RUNNER_TEMP/gpl-source"
          git diff --check
          sh -n "$GITHUB_WORKSPACE/labs/gpl-isolation/test-virtual-egress.sh"
          git diff --stat
          grep -q 'return wol_only_host().await' src/main.rs
          grep -q 'fn wol_only_startup_policy' src/main.rs
          grep -q 'SO_BINDTODEVICE' src/wol.rs
          grep -Fq '("machine_guid", random_uuid)]' src/login.rs
          grep -q 'WOL-only directed packet not sent' src/wol.rs
          grep -q 'return Ok(1)' src/wol.rs
      - name: Rust GPL-only ingress and directed UDP9 egress unit gates
        run: |
          cd "$RUNNER_TEMP/gpl-source"
          cargo test --locked --bin uuremote-server wol_only -- --nocapture
      - name: Compile isolated GPL WOL-only candidate (NEVER run it)
        run: |
          cd "$RUNNER_TEMP/gpl-source"
          cargo build --locked --bin uuremote-server
          test -s target/debug/uuremote-server
          sha256sum target/debug/uuremote-server | cut -d' ' -f1 | sed 's/^/ISOLATED_GPL_BINARY_SHA256=/'
          echo "GPL_WOL_ONLY_COMPILE_PASS"
          echo "NOT_INSTALLABLE: still requires independent runtime capability and cloud verification"
      - name: WOL-only startup refuses assist and incomplete LAN configuration
        run: |
          cd "$RUNNER_TEMP/gpl-source"
          bin=target/debug/uuremote-server
          if env UU_WOL_ONLY=1 UU_NO_GTK=1 UU_WOL_HELPER=1 \
            UU_REMOTE_ASSIST=0 UU_PORT_MAPPING=0 \
            UU_WOL_LAN_IFACE=br-lan UU_WOL_ALLOWED_MAC=02:11:22:33:44:55 \
            "$bin" assist > "$RUNNER_TEMP/wol-assist-test.log" 2>&1; then
            echo "WOL_ONLY_UNSAFE_ASSIST_COMMAND_ACCEPTED"; exit 1
          fi
          grep -q 'WOL_ONLY_STARTUP_DENIED' "$RUNNER_TEMP/wol-assist-test.log"
          # The diagnostic binary must never fall back to full remote host,
          # even if the operator omits UU_WOL_ONLY entirely.
          if env UU_NO_GTK=1 "$bin" --help > "$RUNNER_TEMP/wol-mode-absent.log" 2>&1; then
            echo "WOL_ONLY_FULL_HOST_FALLBACK_ACCEPTED"; exit 1
          fi
          grep -q 'WOL_ONLY_STARTUP_DENIED' "$RUNNER_TEMP/wol-mode-absent.log"
          if env UU_WOL_ONLY=1 UU_NO_GTK=1 UU_WOL_HELPER=1 \
            UU_REMOTE_ASSIST=0 UU_PORT_MAPPING=0 \
            UU_WOL_ALLOWED_MAC=02:11:22:33:44:55 \
            "$bin" > "$RUNNER_TEMP/wol-no-iface-test.log" 2>&1; then
            echo "WOL_ONLY_UNSAFE_MISSING_LAN_ACCEPTED"; exit 1
          fi
          grep -q 'WOL_ONLY_STARTUP_DENIED' "$RUNNER_TEMP/wol-no-iface-test.log"
          echo "GPL_WOL_ONLY_EARLY_STARTUP_REJECT_PASS"
      - name: Virtual-LAN proof of exactly one GPL WOL UDP9 packet (never real network)
        run: |
          cd "$RUNNER_TEMP/gpl-source"
          # Execute exactly one synthetic Rust unit test as the unprivileged
          # runner within a disconnected two-namespace veth-only network.
          sudo sh "$GITHUB_WORKSPACE/labs/gpl-isolation/test-virtual-egress.sh" \
            "$RUNNER_TEMP/gpl-source" "$(id -un)" "$HOME" "$(command -v cargo)"
      - name: Confirm temporary GPL sources remain outside MIT worktree
        run: |
          test -d "$RUNNER_TEMP/gpl-source/.git"
          test ! -e src/main.rs
          test ! -e src/wol.rs
          echo "MIT_GPL_SOURCE_SEPARATION_PASS"

  docker-offline-smoke:
    needs: inspect-only
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate private-lab Compose and build pinned GPL source image
        run: |
          UU_WOL_ALLOWED_MAC=02:11:22:33:44:55 UU_WOL_LAN_IFACE=br-lan \
            docker compose -f labs/gpl-isolation/docker/compose.yaml --profile service config --quiet
          docker build --progress=plain -f labs/gpl-isolation/docker/Dockerfile \
            -t uu-gpl-wol-only:offline-lab .
      - name: Real container startup must deny full remote host without cloud access
        run: |
          if docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -e UU_WOL_ONLY=0 uu-gpl-wol-only:offline-lab \
            > "$RUNNER_TEMP/no-mode.log" 2>&1; then
            echo "CONTAINER_ALLOWED_FULL_REMOTE_FALLBACK"; exit 1
          fi
          grep -q 'WOL_ONLY_STARTUP_DENIED' "$RUNNER_TEMP/no-mode.log"
          if docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -e UU_WOL_ALLOWED_MAC=02:11:22:33:44:55 \
            -e UU_WOL_LAN_IFACE=br-lan \
            uu-gpl-wol-only:offline-lab assist \
            > "$RUNNER_TEMP/assist.log" 2>&1; then
            echo "CONTAINER_ALLOWED_REMOTE_ASSIST"; exit 1
          fi
          grep -q 'WOL_ONLY_STARTUP_DENIED' "$RUNNER_TEMP/assist.log"
          echo "GPL_WOL_ONLY_CONTAINER_STARTUP_DENY_PASS"
      - name: Non-root private identity volume survives a stopped isolated container
        run: |
          set -eu
          volume="uu-wol-only-ci-${{ github.run_id }}"
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -v "$volume:/data" --entrypoint /bin/sh uu-gpl-wol-only:offline-lab \
            -c 'test -w /data && printf marker > /data/ci-marker'
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -v "$volume:/data" --entrypoint /bin/sh uu-gpl-wol-only:offline-lab \
            -c 'test "$(cat /data/ci-marker)" = marker'
          echo "GPL_WOL_ONLY_PERSISTENCE_PASS"
