name: QEMU ARM64 Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qemu-arm64.yml'
      - 'labs/qemu/openwrt-aarch64/**'
      - 'platforms/openwrt/**'
      - 'platforms/xiaoqiang/**'
      - 'lib/**'
      - 'scripts/**'
      - 'uu-helper.sh'

permissions:
  contents: read

jobs:
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install QEMU ARM64 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 expect tcpdump

      - name: Boot official OpenWrt ARM64 image
        run: sh labs/qemu/openwrt-aarch64/boot-smoke.sh

      - name: Validate WAN and NetEase ARM64 API
        run: sh labs/qemu/openwrt-aarch64/network-smoke.sh

      - name: Stage official NetEase ARM64 package in guest
        run: sh labs/qemu/openwrt-aarch64/stage-smoke.sh

      - name: Run official NetEase ARM64 runtime smoke-test in guest
        run: sh labs/qemu/openwrt-aarch64/runtime-smoke.sh

      - name: Validate persistent install reboot health and rollback
        run: sh labs/qemu/openwrt-aarch64/persistent-smoke.sh

      - name: Validate XiaoQiang migration reboot and rollback shim
        run: sh labs/qemu/openwrt-aarch64/xiaoqiang-shim-smoke.sh

      - name: Validate synthetic WOL packet path on isolated virtual LAN
        run: sudo sh labs/qemu/openwrt-aarch64/wol-packet-smoke.sh
