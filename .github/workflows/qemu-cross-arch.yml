name: QEMU x86 and MIPS Boot Lab

on:
  workflow_dispatch:
    inputs:
      lab_mode:
        description: "Choose boot staging or guarded isolated official runtime"
        type: choice
        options:
          - boot-stage
          - guarded-runtime
          - memory-probe
        default: boot-stage
        required: true
  pull_request:
    paths:
      - '.github/workflows/qemu-cross-arch.yml'
      - 'labs/qemu/cross-arch/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qemu-cross-arch.yml'
      - 'labs/qemu/cross-arch/**'

permissions:
  contents: read

jobs:
  guest-boot:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_mode == 'boot-stage'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, mipsel]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install QEMU and serial-console driver
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-mips expect
      - name: Verify pinned OpenWrt guest boot
        run: sh labs/qemu/cross-arch/boot-smoke.sh "${{ matrix.arch }}"

  official-stage:
    # Separate job: archive verification must not be mistaken for plugin runtime.
    if: github.event_name != 'workflow_dispatch' || inputs.lab_mode == 'boot-stage'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, mipsel]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install QEMU and serial-console driver
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-mips expect
      - name: Stage authentic NetEase archive inside guest without launching plugin
        run: sh labs/qemu/cross-arch/boot-smoke.sh "${{ matrix.arch }}" stage

  guarded-runtime:
    # Never auto-start official executables from push/PR events; opt-in only.
    if: github.event_name == 'workflow_dispatch' && inputs.lab_mode == 'guarded-runtime'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, mipsel]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install QEMU and serial-console driver
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-mips expect
      - name: Verify official executable short-lived start and cleanup in disposable offline guest
        run: sh labs/qemu/cross-arch/boot-smoke.sh "${{ matrix.arch }}" runtime

  memory-probe:
    # Explicit manual-only memory profiles. No plugin execution on PR/push.
    if: github.event_name == 'workflow_dispatch' && inputs.lab_mode == 'memory-probe'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {arch: mipsel, ram_mb: 64}
          - {arch: mipsel, ram_mb: 128}
          - {arch: mipsel, ram_mb: 256}
          - {arch: x86_64, ram_mb: 128}
          - {arch: x86_64, ram_mb: 256}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install QEMU and serial-console driver
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-mips expect
      - name: Measure official executable in RAM-limited disposable OpenWrt guest
        run: sh labs/qemu/cross-arch/boot-smoke.sh "${{ matrix.arch }}" resource "${{ matrix.ram_mb }}"
