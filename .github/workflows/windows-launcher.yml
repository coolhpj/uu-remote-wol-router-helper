name: Windows launcher check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-launcher.yml'
      - 'start-windows.cmd'
      - 'tools/windows-launcher.ps1'
      - 'tests/test-windows-launcher.ps1'
  pull_request:
    paths:
      - '.github/workflows/windows-launcher.yml'
      - 'start-windows.cmd'
      - 'tools/windows-launcher.ps1'
      - 'tests/test-windows-launcher.ps1'

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Test launcher with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-windows-launcher.ps1
