notes:
  - This profile records a generic x86_64 iStoreOS/OpenWrt test environment, not a product compatibility claim.
  - Staging and runtime smoke-test used only /tmp; no UCI or persistent overlay setting was changed.
  - Official openwrt-x86_64 v14.6.22 started successfully; uuplugin + guardian + :16000 were healthy within 2 seconds.
  - Temporary UU processes were stopped after the test; XU_* nftables residue was absent and OpenClash remained online.
  - ip rule, ip route and normalized nft ruleset matched the pre-test baseline after cleanup.
  - UU主机加速 App 已在手机默认网关指向 iStoreOS 时识别并绑定 OpenWrt。
  - UU远程辅助设备检测在暂停同账号下 AX86U UU 后切换到通用“路由器”，随后完成手机关闭 Wi-Fi、仅移动数据的远程开机终验。
  - 该 WOL 终验最初使用 /tmp 临时 runtime；随后已完成真实持久安装，并已验证真实 reboot 后 procd 自动恢复 UU runtime。
  - Generic OpenWrt 持久化 adapter 已通过 NAS fake-root 自动测试、真实 iStoreOS BusyBox /tmp fake-root 复验，并在真实 /overlay 上完成安装。
  - 持久路径为 /usr/lib/uu-wol-helper、/etc/init.d/uu-wol-helper、/etc/uu-wol-helper；procd 已 enable，安装后约 2 秒达到 uuplugin + guardian + :16000 健康状态。
  - 安装前备份记录为 /etc/uu-wol-helper/backups/20260830-204554-13316；真实 reboot 后 uuplugin + guardian + :16000 自动恢复，OpenClash 随后正常上线；真实 rollback 仍待验收。
