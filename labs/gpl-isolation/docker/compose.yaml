# GPL-only isolated candidate. For private test labs, NOT an established NAS release.
# Copy .env.example to .env and set explicit approved target MAC and LAN interface.
services:
  uu-wol-only:
    profiles: ["service"]
    build:
      context: ../../..
      dockerfile: labs/gpl-isolation/docker/Dockerfile
    image: uu-gpl-wol-only:isolated-lab
    network_mode: host
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    volumes:
      - uu_wol_only_data:/data
    environment:
      UU_CONFIG: /data/config.json
      UU_DESKTOP_BACKEND: none
      UU_NO_GTK: "1"
      UU_WOL_ONLY: "1"
      UU_WOL_HELPER: "1"
      UU_REMOTE_ASSIST: "0"
      UU_PORT_MAPPING: "0"
      UU_WOL_ALLOWED_MAC: ${UU_WOL_ALLOWED_MAC:?Set approved target MAC in a private env file}
      UU_WOL_LAN_IFACE: ${UU_WOL_LAN_IFACE:?Set explicit NAS LAN adapter name}
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  uu_wol_only_data:
